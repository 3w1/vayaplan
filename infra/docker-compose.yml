services:
  db:
    image: postgres:16-alpine
    container_name: vayaplan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vayaplan
      POSTGRES_USER: ${POSTGRES_USER:-vayaplan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - vayaplan_db_data:/var/lib/postgresql/data
    networks:
      - vayaplan_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vayaplan_user} -d vayaplan"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: vayaplan_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vayaplan.com}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:?WHATSAPP_WEBHOOK_SECRET is required}
      INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET:?INTERNAL_CRON_SECRET is required}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      UPLOADS_DIR: /app/uploads
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-vayaplan-media}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://media.vayaplan.com}
    volumes:
      - vayaplan_uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vayaplan_net

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: vayaplan_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      API_URL: ${API_URL:-https://vayaplan.com/api}
    depends_on:
      - api
    networks:
      - vayaplan_net

volumes:
  vayaplan_db_data:
  vayaplan_uploads_data:

networks:
  vayaplan_net:
    driver: bridge
